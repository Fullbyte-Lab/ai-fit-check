name: 申请免费诊断 / Free diagnosis request
description: 前 2 家免费：给你的重复任务出一份「能不能交给 AI 做」的诊断（3–5 页，一周内）
title: "[诊断申请] <你的行业> — <最费人的那件事>"
labels: ["diagnosis-request"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量写具体数字，能写「每周多少次、每次多少分钟」就不要写「很多」「经常」。
        不必提供客户隐私数据；敏感信息可脱敏或用代号。

  - type: input
    id: org
    attributes:
      label: 你的业务是什么（行业 + 规模）
      placeholder: 例：南京，餐饮门店 1 家，8 人
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: 最费人的那件重复活
      description: 一次只写一件事，写清楚「谁在做、多久做一次、每次多久」
      placeholder: 例：客服微信每天回 30 条咨询，每条 1–2 分钟；周末翻倍
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 现在怎么处理的
      description: 人工流程、用什么工具、谁审、出错会怎样
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: 数据在哪
      description: 纸质/Excel/微信/某系统；能不能导出；字段大概有哪些
    validations:
      required: false

  - type: dropdown
    id: regulated
    attributes:
      label: 是否涉及需要前置资质的业务
      options:
        - 不涉及
        - 涉及（金融/医疗/法律/代办证件等）
        - 不确定
    validations:
      required: true

  - type: checkboxes
    id: agree
    attributes:
      label: 前提确认
      options:
        - label: 我同意结果可被脱敏后作为案例公开（不出现客户名、电话、地址）
          required: true
        - label: 我理解诊断只给结论与路径，不承诺效果
          required: true
